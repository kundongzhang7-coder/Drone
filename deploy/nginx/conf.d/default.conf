# Drone 无人机智能识别系统 —— Nginx 网关配置
# 挂载到容器内 /etc/nginx/conf.d/default.conf
# 职责：托管 Vue 单页应用、反向代理 Java 业务接口、代理 Python WebSocket 实时检测
server {
    listen       80;
    server_name  _;

    # Vue 构建产物目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 视频与结果文件体积较大，放开上传限制（与后端 multipart 上限对齐）
    client_max_body_size 500m;

    # 单页应用 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Java 后端接口：proxy_pass 不带 URI，原样保留 /api 前缀（控制器自带 /api）
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Python 实时检测 WebSocket
    location /ws/ {
        proxy_pass http://python:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # 长连接保持，避免检测过程中被断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
