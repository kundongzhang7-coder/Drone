name: drone-detection

services:
  # ===== MySQL 关系型数据库 =====
  mysql:
    image: mysql:8.4
    container_name: drone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [drone-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Redis 缓存 / 分布式锁 / 登录态 =====
  redis:
    image: redis:7.4-alpine
    container_name: drone-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [drone-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== RabbitMQ 消息队列（含管理台） =====
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: drone-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [drone-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ===== Python YOLO 检测服务 =====
  python:
    build:
      context: ./backend_py
    container_name: drone-python
    restart: unless-stopped
    environment:
      DRONE_COS_SECRET_ID: ${COS_SECRET_ID}
      DRONE_COS_SECRET_KEY: ${COS_SECRET_KEY}
      DRONE_COS_REGION: ${COS_REGION}
      DRONE_COS_BUCKET: ${COS_BUCKET}
      DRONE_COS_BASE_URL: ${COS_BASE_URL}
      DRONE_MODEL_PATH: yolov8n.pt
      DRONE_LOG_LEVEL: INFO
    volumes:
      - yolo-cache:/root/.config/Ultralytics
    expose:
      - "8000"
    networks: [drone-net]

  # ===== Java Spring Boot 业务后端 =====
  server:
    build:
      context: ./backend_java
    container_name: drone-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    networks: [drone-net]

  # ===== Nginx 网关：托管前端 + 反向代理 =====
  nginx:
    build:
      context: ./drone-detection-ui
    container_name: drone-nginx
    restart: unless-stopped
    depends_on:
      - server
      - python
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [drone-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  yolo-cache:

networks:
  drone-net:
    driver: bridge
