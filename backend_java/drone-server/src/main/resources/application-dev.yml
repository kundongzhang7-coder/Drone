# ============================================================
# 本地开发环境配置（默认 profile=dev）。
# 这里的默认值只用于本地开发，均为非生产数据；
# 生产环境（prod）必须通过环境变量注入真实密钥与连接信息。
# ============================================================
spring:
  sql:
    init:
      # 开发环境自动建表并写入种子数据；schema.sql / data.sql 均为幂等脚本
      mode: always
  data:
    redis:
      # 本地 Redis（redis-6379.conf）的开发密码
      password: 123456
  ai:
    model:
      # 关闭 Spring AI 自带的 OpenAI 各模型自动装配，本地无 API Key 也能启动
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

drone:
  jwt:
    # 开发专用固定密钥（仅本地使用，不是生产密钥），长度满足 HS256 至少 32 字节
    secret: dev-only-drone-jwt-secret-please-change-in-prod-0123456789
  ai:
    # 本地默认不启用大模型，避免依赖 DeepSeek 密钥；需要时设置环境变量 AI_ENABLED=true
    enabled: false
